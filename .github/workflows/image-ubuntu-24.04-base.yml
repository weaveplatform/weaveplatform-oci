name: images | ubuntu-24.04-base

# The ubuntu-24.04-base image (images/linux/ubuntu-24.04-base). Pull requests that
# touch the definition, the scripts or the build workflow build it, check
# conformance and boot it, without pushing. Publishing is a deliberate act
# while the platform is being built out: run this workflow by hand with
# publish ticked.
on:
  pull_request:
    paths:
      - 'images/linux/ubuntu-24.04-base/**'
      - 'scripts/linux/**'
      - 'pkg/source/**'
      - 'internal/cli/build.go'
      - '.github/workflows/build-linux.yml'
      - '.github/workflows/image-ubuntu-24.04-base.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Push to GHCR, attest and dispatch the promotion
        type: boolean
        default: false
      serial:
        description: Pin an upstream serial (default the newest)
        type: string
        default: ''
      revision:
        description: Build revision (the r<N> in the tag)
        type: string
        default: '1'

permissions:
  contents: read

concurrency:
  group: image-ubuntu-24.04-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    uses: ./.github/workflows/build-linux.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets: inherit
    with:
      image: linux/ubuntu-24.04-base
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
      serial: ${{ inputs.serial || '' }}
      revision: ${{ inputs.revision || '1' }}
