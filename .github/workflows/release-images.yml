name: release | Images and binaries

# Decision 0012. On a release tag (pushed by release-please through the org
# App, which is what lets a tag start a workflow) this publishes:
#
#   ghcr.io/weaveplatform/weaveoci   ko, distroless static nonroot
#   ghcr.io/weaveplatform/weave-zot  deploy/zot/Dockerfile on pinned upstream zot
#   weaveoci binaries                six platforms, archives plus SHA256SUMS
#
# Both images are linux/amd64 and linux/arm64, tagged X.Y.Z, X.Y and latest,
# signed keyless with cosign (GitHub OIDC identity of this workflow at the
# tag), and carry an SPDX SBOM as a cosign attestation. GitHub build
# provenance (actions/attest) is added when the repository is public: for a
# private repository it needs GitHub Enterprise Cloud. Every published image
# is verified by digest before the job succeeds.
#
# On pull requests everything is built and nothing is pushed, and the
# reference Compose deployment is brought up and probed.
on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - 'deploy/zot/**'
      - '.ko.yaml'
      - '.github/workflows/release-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: 'off'
  REGISTRY: ghcr.io
  OWNER: weaveplatform
  COSIGN_IDENTITY_REGEXP: '^https://github\.com/weaveplatform/weaveplatform-oci/\.github/workflows/release-images\.yml@refs/tags/v'
  COSIGN_ISSUER: https://token.actions.githubusercontent.com

jobs:
  meta:
    name: 'Release metadata'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.m.outputs.release }}
      version: ${{ steps.m.outputs.version }}
      minor: ${{ steps.m.outputs.minor }}
      public: ${{ steps.m.outputs.public }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - id: m
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PRIVATE: ${{ github.event.repository.private }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$REF_TYPE" = tag ]; then
            v=${REF_NAME#v}
            printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::tag $REF_NAME is not vX.Y.Z"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            v="0.0.0-dev.${SHA:0:12}"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=$(printf '%s' "$v" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          if [ "$PRIVATE" = true ]; then echo "public=false"; else echo "public=true"; fi >> "$GITHUB_OUTPUT"

  weaveoci-image:
    name: 'weaveoci image (ko)'
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/weaveplatform/weaveoci
      VERSION: ${{ needs.meta.outputs.version }}
      MINOR: ${{ needs.meta.outputs.minor }}
      RELEASE: ${{ needs.meta.outputs.release }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Set up ko v0.19.1
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1

      - name: Build (and push on a release)
        id: build
        env:
          KO_DOCKER_REPO: ${{ env.IMAGE }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          export BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          push=false
          tags="$VERSION"
          if [ "$RELEASE" = true ]; then
            push=true
            tags="$VERSION,$MINOR,latest"
            echo "$GH_TOKEN" | ko login ghcr.io --username "$ACTOR" --password-stdin
          fi
          ref=$(ko build ./cmd/weaveoci --bare --push="$push" --tags "$tags" \
            --image-label org.opencontainers.image.source=https://github.com/weaveplatform/weaveplatform-oci \
            --image-label org.opencontainers.image.title=weaveoci \
            --image-label "org.opencontainers.image.version=$VERSION" \
            --image-label org.opencontainers.image.licenses=MIT)
          echo "ref=$ref"
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

      - name: Install cosign v3.1.3
        if: needs.meta.outputs.release == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Log in to GHCR
        if: needs.meta.outputs.release == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Sign
        if: needs.meta.outputs.release == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: SBOM
        if: needs.meta.outputs.release == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attach the SBOM as a cosign attestation
        if: needs.meta.outputs.release == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"

      - name: GitHub build provenance (public repositories)
        if: needs.meta.outputs.release == 'true' && needs.meta.outputs.public == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify what was published
        if: needs.meta.outputs.release == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLIC: ${{ needs.meta.outputs.public }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cosign verify --certificate-identity-regexp "$COSIGN_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$COSIGN_ISSUER" "$IMAGE@$DIGEST" > /dev/null
          cosign verify-attestation --type spdxjson --certificate-identity-regexp "$COSIGN_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$COSIGN_ISSUER" "$IMAGE@$DIGEST" > /dev/null
          if [ "$PUBLIC" = true ]; then
            gh attestation verify "oci://$IMAGE@$DIGEST" -R weaveplatform/weaveplatform-oci
          fi
          echo "verified $IMAGE@$DIGEST"

  weave-zot-image:
    name: 'weave-zot image (buildx)'
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/weaveplatform/weave-zot
      VERSION: ${{ needs.meta.outputs.version }}
      MINOR: ${{ needs.meta.outputs.minor }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The final stage only copies files and the weaveoci stage
      # cross-compiles on the build platform, so no QEMU is needed.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: needs.meta.outputs.release == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build (and push on a release)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/zot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.meta.outputs.release == 'true' }}
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.MINOR }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Provenance and SBOM come from cosign and actions/attest below;
          # buildx's own would add unknown/unknown entries to the index.
          provenance: false
          sbom: false

      - name: Install cosign v3.1.3
        if: needs.meta.outputs.release == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign
        if: needs.meta.outputs.release == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: SBOM
        if: needs.meta.outputs.release == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attach the SBOM as a cosign attestation
        if: needs.meta.outputs.release == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"

      - name: GitHub build provenance (public repositories)
        if: needs.meta.outputs.release == 'true' && needs.meta.outputs.public == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify what was published
        if: needs.meta.outputs.release == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLIC: ${{ needs.meta.outputs.public }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cosign verify --certificate-identity-regexp "$COSIGN_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$COSIGN_ISSUER" "$IMAGE@$DIGEST" > /dev/null
          cosign verify-attestation --type spdxjson --certificate-identity-regexp "$COSIGN_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$COSIGN_ISSUER" "$IMAGE@$DIGEST" > /dev/null
          if [ "$PUBLIC" = true ]; then
            gh attestation verify "oci://$IMAGE@$DIGEST" -R weaveplatform/weaveplatform-oci
          fi
          docker run --rm "$IMAGE@$DIGEST" verify /etc/zot/roles/private.json
          docker run --rm "$IMAGE@$DIGEST" verify /etc/zot/roles/mirror.json
          echo "verified $IMAGE@$DIGEST"

  compose:
    name: 'Reference Compose deployment'
    needs: meta
    if: needs.meta.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The README's setup, verbatim in spirit: an htpasswd with bcrypt
      # entries, then compose up. --wait returns once the image's
      # HEALTHCHECK (weaveoci healthcheck on /readyz) reports healthy.
      - name: docker compose up
        working-directory: deploy/zot
        env:
          WEAVE_ZOT_IMAGE: weave-zot:compose
        run: |
          set -euo pipefail
          pw=$(openssl rand -hex 16)
          echo "PUBLISHER_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run --rm httpd:2-alpine htpasswd -Bbn publisher "$pw" > htpasswd
          docker compose up --build --detach --wait registry

      - name: Probe the registry
        run: |
          set -euo pipefail
          anon=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/v2/)
          auth=$(curl -s -o /dev/null -w '%{http_code}' -u "publisher:$PUBLISHER_PASSWORD" http://127.0.0.1:5000/v2/)
          echo "anonymous: $anon, publisher: $auth"
          [ "$anon" = 401 ] && [ "$auth" = 200 ]

      - name: docker compose down
        if: always()
        working-directory: deploy/zot
        run: docker compose down --volumes

  binaries:
    name: 'weaveoci binaries'
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Build, archive and upload to the release
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make build VERSION="$VERSION"
          mkdir dist
          for f in bin/weaveoci-*; do
            base=$(basename "$f" .exe)
            platform=${base#weaveoci-}
            stage=$(mktemp -d)
            cp LICENSE README.md "$stage/"
            case "$f" in
              *.exe) cp "$f" "$stage/weaveoci.exe"; (cd "$stage" && zip -q "$OLDPWD/dist/weaveoci_${VERSION}_${platform}.zip" ./*) ;;
              *)     cp "$f" "$stage/weaveoci"; tar -C "$stage" -czf "dist/weaveoci_${VERSION}_${platform}.tar.gz" . ;;
            esac
          done
          (cd dist && sha256sum ./* | sed 's| \./| |' > SHA256SUMS)
          cat dist/SHA256SUMS
          gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
