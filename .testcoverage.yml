# Coverage gate (decision 0013): >=95% total, >=90% per package;
# security-sensitive packages additionally require >=95% (see overrides below).
# The profile is produced by `make cover`, which merges unit, acceptance and
# per-OS runner coverage from cover/* with `go tool covdata`.
profile: cover/coverage.out
threshold:
  file: 0
  package: 90
  total: 95
exclude:
  paths:
    # Binary entry point: a thin shim over internal/cli.
    - ^cmd/
# Artifact handoff and verification retain stricter coverage requirements.
override:
  - path: ^pkg/handoff$
    threshold: 95
  - path: ^pkg/imagecheck$
    threshold: 95
  - path: ^pkg/disk/virtualdisk$
    threshold: 95
  - path: ^pkg/agentcheck$
    threshold: 95
  - path: ^pkg/macsetup$
    threshold: 95
